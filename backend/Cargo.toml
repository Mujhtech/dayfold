[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
# Use the supported AWS-LC provider for APNs ES256 signing. The alternative
# rust_crypto feature includes vulnerable crypto-bigint/RSA dependencies.
jsonwebtoken = { version = "12.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["limit", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
