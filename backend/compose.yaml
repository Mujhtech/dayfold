name: dayfold-backend
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dayfold
      POSTGRES_PASSWORD: dayfold-local-only
      POSTGRES_DB: dayfold
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayfold -d dayfold"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
